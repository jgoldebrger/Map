services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sip
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
