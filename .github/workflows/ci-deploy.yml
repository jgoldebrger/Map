# Branch workflow:
#   develop  — push here; full CI + E2E, then auto-merge to main + Vercel deploy
#   PRs      — lint + build only
#
# E2E uses mcr.microsoft.com/playwright (browsers preinstalled) — no `playwright install`.

name: CI & Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-build-only-secret-min-32-chars-long
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci

  test-and-e2e:
    name: Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --ipc=host
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      DIRECT_URL: ${{ vars.DIRECT_URL }}
      AUTH_SECRET: ${{ vars.AUTH_SECRET }}
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_HOST: 127.0.0.1
      PLAYWRIGHT_PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Check Production environment variables
        run: |
          echo "DATABASE_URL: ${{ vars.DATABASE_URL != '' && 'yes' || 'MISSING' }}"
          echo "DIRECT_URL: ${{ vars.DIRECT_URL != '' && 'yes' || 'MISSING' }}"
          echo "AUTH_SECRET: ${{ vars.AUTH_SECRET != '' && 'yes' || 'MISSING' }}"
          echo "ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL != '' && 'yes' || 'MISSING' }}"
          echo "ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD != '' && 'yes' || 'MISSING' }}"
          echo "NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN != '' && 'yes' || 'MISSING' }}"

      - name: Validate CI secrets
        run: bash scripts/validate-ci-env.sh

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed admin user
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Prepare standalone app for E2E
        run: bash scripts/prepare-standalone-e2e.sh

      - name: E2E tests
        run: npm run test:e2e

  merge-to-main:
    name: Merge develop → main
    needs: test-and-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout main
          git merge origin/develop --no-edit -m "chore: promote develop to main"
          git push origin main

  deploy:
    name: Deploy to Vercel
    needs: merge-to-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Use repository secrets (Settings → Actions → Secrets), not Production environment secrets
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel deploy secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/validate-deploy-secrets.sh

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
